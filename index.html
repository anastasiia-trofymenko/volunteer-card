<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volunteer Cards</title>

    <!--Modern Normalize-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css"
      integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <div class="header">
          <h1>Volunteer Opportunities</h1>
          <p>Find your next meaningful adventure</p>
        </div>

        <div id="cards-container" class="cards-grid">
          <div class="loading">Loading opportunities</div>
        </div>
      </div>
    </main>

    <script type="module" src="./js/script.js"></script>
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>Application for <span id="modal-org"></span></h2>
        <form id="apply-form">
          <input
            type="text"
            id="firstName"
            name="firstName"
            placeholder="Name"
            required
          />
          <input
            type="text"
            id="surname"
            name="surname"
            placeholder="Surname"
            required
          />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
          />
          <button type="submit" class="form-send-btn">Send</button>
        </form>
        <div
          id="form-success"
          style="display: none; padding: 16px 0; color: #6512c7"
        >
          Thank you for your application!
        </div>
      </div>
    </div>
  </body>
</html>
